description: Evaluating RAG responses using multiple quality metrics

prompts:
  - |
    You are an internal corporate chatbot.
    Respond to this query: {{query}}
    Here is some context that you can use to write your response: {{context}}

providers:
  - bedrock:converse:us.openai.gpt-6-luna

tests:
  - vars:
      query: What is the max purchase that doesn't require approval?
      context: file://docs/reimbursement.md
    assert:
      # Checks whether the response literally contains value (case-sensitive); score is 1 or 0.
      - type: contains
        value: '$500'
      # Compares response facts with the reference in value; a judge classifies the relationship and assigns a score.
      - type: factuality
        value: the employee's manager is responsible for approvals
      # Measures whether the response addresses the query by generating 3 possible questions from it.
      # Score = mean cosine similarity between the query embedding and the generated question embeddings.
      - type: answer-relevance
        threshold: 0.9
      # Measures whether the context supports the reference answer (value).
      # Score = reference statements supported by the context / total reference statements.
      - type: context-recall
        threshold: 0.9
        value: max purchase price without approval is $500. Talk to Fred before submitting anything.
      # Measures how much of the context is essential to answering the query.
      # Score = essential segments extracted by the judge / total context segments.
      - type: context-relevance
        threshold: 0.9
      # Measures whether claims in the generated response are supported by the context.
      # Score = claims supported by the context / total response claims.
      - type: context-faithfulness
        threshold: 0.9

  - vars:
      query: How many weeks is maternity leave?
      context: file://docs/maternity.md
    assert:
      - type: factuality
        value: maternity leave is 4 months
      - type: answer-relevance
        threshold: 0.9
      - type: context-recall
        threshold: 0.9
        value: The company offers 4 months of maternity leave, unless you are an elephant, in which case you get 22 months of maternity leave.
      - type: context-relevance
        threshold: 0.9
      - type: context-faithfulness
        threshold: 0.9
