# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: D&D Adventure with GPT-6 Luna on Amazon Bedrock Runtime

prompts:
  - '{{query}}'

providers:
  - id: file://./agents/dungeon-master-agent.ts
    config:
      maxTurns: 20

# Explicit grading avoids falling back to Google or the direct OpenAI API.
defaultTest:
  options:
    provider:
      id: bedrock:converse:us.openai.gpt-6-luna
      config:
        region: us-east-1

tests:
  - description: Dragon combat with attack roll
    vars:
      query: 'I draw my longsword and attack the red dragon!'
    assert:
      # Check completed SDK tool executions, not tool names mentioned in the answer.
      - type: javascript
        metric: Tool call and arguments
        value: |
          const calls = context.metadata?.toolCalls;
          return Array.isArray(calls) && calls.some(call =>
            call.name === 'roll_dice' && call.arguments.sides === 20 && call.arguments.count === 1);
      - type: llm-rubric
        value: Response shows the attack roll and, if it hits, the damage roll, then describes the combat outcome dramatically
      - type: javascript
        value: |
          // Check that the answer shows dice mechanics and the attack outcome.
          return (output.toLowerCase().includes('roll') || output.toLowerCase().includes('d20')) &&
                 (output.toLowerCase().includes('attack') || output.toLowerCase().includes('hit'));

  - description: Check character stats before battle
    vars:
      query: 'What are my character stats and current HP?'
    assert:
      - type: javascript
        metric: Tool call and arguments
        value: |
          const calls = context.metadata?.toolCalls;
          return Array.isArray(calls) && calls.some(call =>
            call.name === 'check_character_stats' && call.arguments.playerId === 'player1');
      - type: contains-any
        value: ['Thorin', 'Fighter', 'level 5']
      - type: javascript
        value: |
          // Should mention HP or hit points
          return output.toLowerCase().includes('hp') || output.toLowerCase().includes('hit points');

  - description: Check inventory and equipment
    vars:
      query: 'What weapons and items do I have with me?'
    assert:
      - type: javascript
        metric: Tool call and arguments
        value: |
          const calls = context.metadata?.toolCalls;
          return Array.isArray(calls) && calls.some(call =>
            call.name === 'check_inventory' && call.arguments.playerId === 'player1');
      - type: contains
        value: Longsword
      - type: contains
        value: Potion
      - type: javascript
        value: |
          // Should mention gold
          return output.includes('gold') || output.includes('gp');

  - description: Enter ominous dungeon with scene description
    vars:
      query: 'I cautiously enter the ancient crypt, torch held high'
    assert:
      - type: javascript
        metric: Tool call and arguments
        value: |
          const calls = context.metadata?.toolCalls;
          return Array.isArray(calls) && calls.some(call =>
            call.name === 'describe_scene' && call.arguments.location === 'crypt');
      - type: llm-rubric
        value: Response paints vivid atmospheric scene with sensory details and presents clear choices
      - type: javascript
        value: |
          // Should be descriptive (>100 chars) and mention darkness/light
          return output.length > 100 &&
                 (output.toLowerCase().includes('dark') ||
                  output.toLowerCase().includes('torch') ||
                  output.toLowerCase().includes('shadows'));

  - description: Saving throw during trap
    vars:
      query: 'I step on a pressure plate and hear a click. What happens?'
    assert:
      - type: javascript
        metric: Tool call and arguments
        value: |
          const calls = context.metadata?.toolCalls;
          return Array.isArray(calls) && calls.some(call =>
            call.name === 'roll_dice' && call.arguments.sides === 20 && call.arguments.count === 1);
      - type: llm-rubric
        value: Response triggers a trap, identifies the saving throw, shows its dice roll, and describes the outcome
      - type: javascript
        value: |
          // Should mention saving throw or roll
          return output.toLowerCase().includes('save') || output.toLowerCase().includes('saving throw');

  - description: Critical hit celebration
    vars:
      query: 'I attack the goblin with my longsword!'
    assert:
      - type: javascript
        metric: Tool call and arguments
        value: |
          const calls = context.metadata?.toolCalls;
          return Array.isArray(calls) && calls.some(call =>
            call.name === 'roll_dice' && call.arguments.sides === 20 && call.arguments.count === 1);
      - type: llm-rubric
        value: Response includes attack roll mechanics and outcome description

  - description: Ridiculous player action
    vars:
      query: 'I attempt to seduce the ancient dragon using interpretive dance'
    assert:
      - type: javascript
        metric: Tool call and arguments
        value: |
          const calls = context.metadata?.toolCalls;
          return Array.isArray(calls) && calls.some(call =>
            call.name === 'roll_dice' && call.arguments.sides === 20 && call.arguments.count === 1);
      - type: llm-rubric
        value: DM responds with humor and wit, identifies an appropriate ability check, and shows its dice roll and outcome

  - description: Request for short rest
    vars:
      query: 'I want to take a short rest to recover'
    assert:
      - type: javascript
        metric: No premature dice roll
        value: |
          const calls = context.metadata?.toolCalls;
          return Array.isArray(calls) && !calls.some(call => call.name === 'roll_dice');
      - type: llm-rubric
        value: Response explains short-rest recovery and asks whether or how many Hit Dice the player wants to spend, without spending them for the player

  - description: Mysterious magic item examination
    vars:
      query: 'I examine the Mysterious Amulet in my inventory more closely'
    assert:
      - type: javascript
        metric: Tool call and arguments
        value: |
          const calls = context.metadata?.toolCalls;
          return Array.isArray(calls) && calls.some(call =>
            call.name === 'check_inventory' && call.arguments.playerId === 'player1');
      - type: contains-any
        value: ['undead', 'glow', 'amulet']
      - type: llm-rubric
        value: Response provides intriguing details about the magic item
