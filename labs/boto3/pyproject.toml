[project]
name = "ai-eval-labs"
version = "0.1.0"
description = "Notebook lessons for evaluating AI applications on Amazon Bedrock"
requires-python = ">=3.12"
dependencies = ["boto3>=1.40,<2", "jupyterlab>=4.4,<5", "ipykernel>=6.30,<8", "python-dotenv>=1.1,<2"]

[dependency-groups]
dev = ["pytest>=8.4,<10", "nbclient>=0.10,<1", "nbformat>=5.10,<6"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
